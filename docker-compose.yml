version: '3.8'

services:
  app:
    build:
      context: ./docker/backend
      dockerfile: Dockerfile
    ports:
      - "8080:8000"
    environment:
        DB_USER: ${DB_USER}
        DB_PASSWORD: ${DB_PASSWORD}
        DB_HOST: ${DB_HOST}
        DB_PORT: ${DB_PORT}
        DB_NAME: ${DB_NAME}
        API_KEY: ${API_KEY}
    volumes:
      - .:/app/
    depends_on:
      - psql

  psql:
    build:
      context: ./docker/psql
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d

volumes:
  postgres_data: {}
  redis_data: {}